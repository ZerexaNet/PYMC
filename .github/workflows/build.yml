name: Build PYMC

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Linux build ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-dev python3-pip
          pip install -r requirements.txt
      - name: Build native components
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable"
          make -j$(nproc)
          cmake --install . --prefix stage
      - name: Run tests
        run: python3 -m pytest tests/ -v
      - name: Check native binaries
        # Nuitka's --include-data-dir silently drops executables and shared
        # libraries, so they are listed explicitly; make sure they exist.
        run: |
          ls -l build/stage/native
          test -x build/stage/native/terrain_gen
          test -x build/stage/native/mob_ai
          test -f build/stage/native/libpymc_vanilla.*
          build/stage/native/terrain_gen --version | grep -q "pymc-worldgen 2"
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python3 -m nuitka --standalone --onefile --assume-yes-for-downloads \
            --include-data-file=world/blocks.json=world/blocks.json \
            --include-data-dir=protocol/data=protocol/data \
            --include-data-dir=world/data=world/data \
            '--include-data-files=build/stage/native/*=native/' \
            main.py -o pymc-server-linux-x86_64
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymc-server-linux
          path: pymc-server-linux-x86_64
          retention-days: 1

  # ── macOS build ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          brew install cmake
          pip install -r requirements.txt
      - name: Build native components
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable"
          make -j$(sysctl -n hw.ncpu)
          cmake --install . --prefix stage
      - name: Run tests
        run: python3 -m pytest tests/ -v
      - name: Check native binaries
        # Nuitka's --include-data-dir silently drops executables and shared
        # libraries, so they are listed explicitly; make sure they exist.
        run: |
          ls -l build/stage/native
          test -x build/stage/native/terrain_gen
          test -x build/stage/native/mob_ai
          test -f build/stage/native/libpymc_vanilla.*
          build/stage/native/terrain_gen --version | grep -q "pymc-worldgen 2"
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python3 -m nuitka --standalone --onefile --assume-yes-for-downloads \
            --include-data-file=world/blocks.json=world/blocks.json \
            --include-data-dir=protocol/data=protocol/data \
            --include-data-dir=world/data=world/data \
            '--include-data-files=build/stage/native/*=native/' \
            main.py -o pymc-server-macos-arm64
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymc-server-macos
          path: pymc-server-macos-arm64
          retention-days: 1

  # ── Windows build ──
  # Uses Microsoft Visual C++ (MSVC) instead of MinGW to avoid UCRT
  # api-ms-win-crt-* DLL dependencies that fail to load on Windows
  # machines missing the Visual C++ Redistributable runtime.
  # MSVC with /MT statically links the C runtime into the .exe, so
  # the resulting terrain_gen.exe / mob_ai.exe have ZERO external
  # DLL dependencies beyond KERNEL32.dll (present on every Windows
  # since NT 4.0).
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native components
        # Use MSVC (cl.exe) via CMake's default generator. CMakeLists.txt
        # sets CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded (= /MT) so the
        # C runtime is statically linked into each .exe, producing
        # binaries with ZERO external DLL dependencies beyond KERNEL32.dll.
        shell: cmd
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j
          cmake --install . --config Release --prefix stage
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Check native binaries
        # Nuitka's --include-data-dir silently drops .exe/.dll files, so they
        # are listed explicitly; make sure they exist.
        shell: bash
        run: |
          ls -l build/stage/native
          test -f build/stage/native/terrain_gen.exe
          test -f build/stage/native/mob_ai.exe
          test -f build/stage/native/pymc_vanilla.dll
          build/stage/native/terrain_gen.exe --version | grep -q "pymc-worldgen 2"
      - name: Build with Nuitka
        # Nuitka on Windows defaults to MSVC. No --mingw64 flag, so it
        # picks up the MSVC environment set up by ilammy/msvc-dev-cmd above.
        run: |
          pip install nuitka
          python -m nuitka --standalone --onefile --assume-yes-for-downloads `
            --include-data-file=world/blocks.json=world/blocks.json `
            --include-data-dir=protocol/data=protocol/data `
            --include-data-dir=world/data=world/data `
            '--include-data-files=build/stage/native/*=native/' `
            main.py -o pymc-server-windows-x86_64.exe
      - name: Stage native binaries for separate download
        # Copy the MSVC-built, statically-linked /MT .exe files so users
        # running PyMC from Python source can drop them into their
        # local native/ directory without needing any DLLs.
        shell: bash
        run: |
          cp build/Release/terrain_gen.exe terrain_gen.exe
          cp build/Release/mob_ai.exe      mob_ai.exe
          cp build/Release/pymc_vanilla.dll pymc_vanilla.dll
          ls -lh terrain_gen.exe mob_ai.exe pymc_vanilla.dll
          # Sanity check: list DLL dependencies. We expect only KERNEL32.dll
          # and the api-ms-win-crt-* stubs (which are part of Windows itself,
          # not the Visual C++ Redistributable).
          dumpbin //dependents terrain_gen.exe || true
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymc-server-windows
          path: |
            pymc-server-windows-x86_64.exe
            terrain_gen.exe
            mob_ai.exe
            pymc_vanilla.dll
          retention-days: 1

  # ── Was this push to main the merge of a "[release-vX.Y.Z] ..." pull request? ──
  # Then the release job tags the merge commit vX.Y.Z and publishes a stable release
  # (tags pushed with GITHUB_TOKEN would not start another workflow, so it is done here).
  detect-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.find.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find release version in the merged pull request title
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=""
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TITLES=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].title' 2>/dev/null || true)
            TITLES="${TITLES}
          $(git log -1 --format=%B "${GITHUB_SHA}")"
            VERSION=$(printf '%s\n' "$TITLES" \
              | grep -oiE '\[release[- ]v?[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*\]' | head -1 \
              | sed -E 's/^\[release[- ]v?//I; s/\]$//')
            if [ -n "$VERSION" ] && git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
              echo "Tag v${VERSION} already exists; publishing a pre-release instead"
              VERSION=""
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION:-<none>}"

  # ── Auto pre-release for other pushes ──
  auto-prerelease:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && needs.detect-release.outputs.version == ''
    needs: [build-linux, build-macos, build-windows, detect-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate pre-release tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          TIMESTAMP=$(date -u +%Y%m%d.%H%M%S)
          TAG="pre-${TIMESTAMP}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: ls -lh release-assets/
      - name: Create pre-release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pre-release ${{ steps.tag.outputs.tag }}"
          prerelease: true
          files: release-assets/*
          body: |
            ⚠️ **Auto-generated pre-release** from `${{ steps.tag.outputs.sha }}`

            This is an automated development build. Not a stable release.

            Commit: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            Branch: `${{ github.ref_name }}`

            ### Downloads
            - **Linux (x86_64)**: `pymc-server-linux-x86_64`
            - **macOS (ARM64)**: `pymc-server-macos-arm64`
            - **Windows (x86_64)**: `pymc-server-windows-x86_64.exe`

            ### Native helper binaries (Windows, separate download)
            If you run PyMC directly from Python source on Windows (not via the
            Nuitka-packaged `pymc-server-windows-x86_64.exe`), you also need
            the statically-linked native helper binaries. Replace the files in
            your local `native/` directory with these:
            - `terrain_gen.exe` — C++ terrain generator (statically linked, no DLL dependencies)
            - `mob_ai.exe` — C++ mob AI engine (statically linked, no DLL dependencies)
            - `pymc_vanilla.dll` — C++ redstone / hopper / explosion engine (loaded in-process)

            These are built with MSVC (/MT) and have the C++ runtime baked in,
            so they run on stock Windows 10/11 without the Visual C++ Redistributable.

      - name: Tag summary
        run: echo "Created pre-release tag ${{ steps.tag.outputs.tag }} with build artifacts"

  # ── Stable release: a pushed v* tag, or a merged "[release-vX.Y.Z]" pull request ──
  release:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.detect-release.outputs.version != '')
    needs: [build-linux, build-macos, build-windows, detect-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.detect-release.outputs.version) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Name release files
        run: |
          cd release-assets
          mv pymc-server-linux-x86_64 PyMC-linux
          mv pymc-server-macos-arm64 PyMC-macos
          mv pymc-server-windows-x86_64.exe PyMC-windows.exe
          chmod +x PyMC-linux PyMC-macos
          ls -lh
      - name: Release notes
        run: |
          VERSION="${TAG#v}"
          # Previous stable version tag (highest v* below this one, no pre-releases)
          PREV=$( (git tag --list 'v[0-9]*'; echo "$TAG") | sort -u | sort -rV | grep -v -- '-' \
                 | awk -v cur="$TAG" 'seen { print; exit } $0 == cur { seen = 1 }')
          {
            echo "## PyMC ${TAG}"
            echo
            # The section of CHANGELOG.md for this version
            awk -v v="$VERSION" '
              /^## / { found = ($0 ~ "^## \\[?" v "\\]?([ ]|$)"); next }
              found' CHANGELOG.md
            echo
            echo "### 下载"
            echo "- \`PyMC-windows.exe\`：Windows (x86_64)，双击运行"
            echo "- \`PyMC-linux\`：Linux (x86_64)，\`chmod +x PyMC-linux && ./PyMC-linux\`"
            echo "- \`PyMC-macos\`：macOS (ARM64)，\`chmod +x PyMC-macos && ./PyMC-macos\`"
            echo "- \`terrain_gen.exe\` / \`mob_ai.exe\` / \`pymc_vanilla.dll\`：从 Python 源码在 Windows 上运行时放进 \`native/\` 的原生组件"
            echo
            echo "Minecraft Java 1.21.1 客户端连接 \`ip:25565\`。"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${PREV}...${TAG}"
            fi
          } > release-notes.md
          cat release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: PyMC ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          body_path: release-notes.md
          files: release-assets/*
