name: Build PYMC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linux build ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-dev python3-pip
          pip install -r requirements.txt
      - name: Build native components
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable"
          make -j$(nproc)
      - name: Run tests
        run: python3 -m pytest tests/ -v
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python3 -m nuitka --standalone --onefile --assume-yes-for-downloads \
            --include-data-file=world/blocks.json=world/blocks.json \
            main.py -o pymc-server-linux-x86_64
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymc-server-linux
          path: pymc-server-linux-x86_64
          retention-days: 1

  # ── macOS build ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          brew install cmake
          pip install -r requirements.txt
      - name: Build native components
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable"
          make -j$(sysctl -n hw.ncpu)
      - name: Run tests
        run: python3 -m pytest tests/ -v
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python3 -m nuitka --standalone --onefile --assume-yes-for-downloads \
            --include-data-file=world/blocks.json=world/blocks.json \
            main.py -o pymc-server-macos-arm64
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymc-server-macos
          path: pymc-server-macos-arm64
          retention-days: 1

  # ── Windows build ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install MinGW via MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
      - name: Build native components
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable"
          mingw32-make -j$(nproc)
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python -m nuitka --standalone --onefile --mingw64 --assume-yes-for-downloads `
            --include-data-file=world/blocks.json=world/blocks.json `
            main.py -o pymc-server-windows-x86_64.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymc-server-windows
          path: pymc-server-windows-x86_64.exe
          retention-days: 1

  # ── Auto pre-release for non-tagged pushes ──
  auto-prerelease:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate pre-release tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          TIMESTAMP=$(date -u +%Y%m%d.%H%M%S)
          TAG="pre-${TIMESTAMP}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: ls -lh release-assets/
      - name: Create pre-release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pre-release ${{ steps.tag.outputs.tag }}"
          prerelease: true
          files: release-assets/*
          body: |
            ⚠️ **Auto-generated pre-release** from `${{ steps.tag.outputs.sha }}`

            This is an automated development build. Not a stable release.

            Commit: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            Branch: `${{ github.ref_name }}`

            ### Downloads
            - **Linux (x86_64)**: `pymc-server-linux-x86_64`
            - **macOS (ARM64)**: `pymc-server-macos-arm64`
            - **Windows (x86_64)**: `pymc-server-windows-x86_64.exe`

      - name: Tag summary
        run: echo "Created pre-release tag ${{ steps.tag.outputs.tag }} with build artifacts"
