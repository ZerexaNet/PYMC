name: Build PYMC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Auto pre-release for non-tagged pushes ──
  auto-prerelease:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate pre-release tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          TIMESTAMP=$(date -u +%Y%m%d.%H%M%S)
          TAG="pre-${TIMESTAMP}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"
      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pre-release ${{ steps.tag.outputs.tag }}"
          prerelease: true
          body: |
            ⚠️ **Auto-generated pre-release** from `${{ steps.tag.outputs.sha }}`

            This is an automated development build. Not a stable release.

            Commit: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            Branch: `${{ github.ref_name }}`

      - name: Tag summary
        run: echo "Created pre-release tag ${{ steps.tag.outputs.tag }}"

  # ── Linux build ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-dev python3-pip
          pip install -r requirements.txt
      - name: Build native components
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable"
          make -j$(nproc)
      - name: Run tests
        run: python3 -m pytest tests/ -v
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python3 -m nuitka --standalone --onefile --assume-yes-for-downloads main.py -o pymc-server

  # ── Windows build ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install MinGW via MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
      - name: Build native components
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable"
          mingw32-make -j$(nproc)
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python -m nuitka --standalone --onefile --mingw64 --assume-yes-for-downloads main.py -o pymc-server.exe
