name: Build PYMC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-dev python3-pip
          pip install -r requirements.txt
      - name: Build native components
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable"
          make -j$(nproc)
      - name: Run tests
        run: python3 -m pytest tests/ -v
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python3 -m nuitka --standalone --onefile main.py -o pymc-server

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
      - name: Build native components
        run: |
          mkdir build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          mingw32-make -j$env:NUMBER_OF_PROCESSORS
      - name: Build with Nuitka
        run: |
          pip install nuitka
          python -m nuitka --standalone --onefile --mingw64 main.py -o pymc-server.exe
