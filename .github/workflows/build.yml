name: 构建并发布

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 版本
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 检查 MSVC
        shell: pwsh
        run: |
          cl

      - name: 安装 Nuitka
        run: pip install nuitka ordered-set zstandard

      - name: 编译 terrain_gen.exe
        shell: cmd
        run: |
          cl /O2 /EHsc /std:c++17 /Fe:native\terrain_gen.exe native\terrain_gen.cpp

      - name: 检查 terrain_gen.exe
        shell: pwsh
        run: |
          dir native\terrain_gen.exe

      - name: Nuitka 打包 Windows
        shell: pwsh
        run: >
          python -m nuitka
          --standalone
          --onefile
          --assume-yes-for-downloads
          --msvc=latest
          --output-dir=dist
          --include-data-dir=native=native
          --windows-console-mode=force
          --output-filename=PyMC-windows.exe
          main.py

      - name: 验证 Windows 产物
        shell: pwsh
        run: |
          dir dist\PyMC-windows.exe

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pymc-windows
          path: dist/PyMC-windows.exe

  build-linux:
    name: 构建 Linux 版本
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ patchelf upx-ucl

      - name: 安装 Nuitka
        run: pip install nuitka ordered-set zstandard

      - name: 编译 terrain_gen
        run: |
          g++ -O3 -std=c++17 -static -o native/terrain_gen native/terrain_gen.cpp
          ls -l native/terrain_gen

      - name: Nuitka 打包 Linux
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --include-data-dir=native=native \
            --output-filename=PyMC-linux \
            main.py

      - name: 验证 Linux 产物
        run: |
          ls -l dist/PyMC-linux
          chmod +x dist/PyMC-linux

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pymc-linux
          path: dist/PyMC-linux

  release:
    name: 发布 Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: pymc-windows
          path: release_files

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v4
        with:
          name: pymc-linux
          path: release_files

      - name: 生成发布版本号
        id: release_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: PyMC ${{ steps.release_version.outputs.tag }}
          body: |
            ## PyMC ${{ steps.release_version.outputs.tag }}

            Minecraft Java Edition 1.21.1 (协议版本 767) 纯 Python 服务端。

            ### 包含文件
            - `PyMC-windows.exe`：Windows 版本
            - `PyMC-linux`：Linux 版本

            ### 使用方法

            #### Windows
            1. 下载 `PyMC-windows.exe`
            2. 双击运行
            3. Minecraft 客户端连接 `localhost:25565`

            #### Linux
            1. 下载 `PyMC-linux`
            2. 执行 `chmod +x PyMC-linux`
            3. 运行 `./PyMC-linux`
            4. Minecraft 客户端连接 `localhost:25565`

            ### 包含
            - Python 服务端（Nuitka 编译）
            - 原生地形生成器（已内置）
          files: |
            release_files/PyMC-windows.exe
            release_files/PyMC-linux
          draft: false
          prerelease: true
          generate_release_notes: true
      - name: 加入 GCC 到 PATH
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 检查编译器
        shell: pwsh
        run: |
          gcc --version
          g++ --version

      - name: 编译 terrain_gen.exe
        shell: pwsh
        run: |
          g++ -O3 -std=c++17 -static -o native/terrain_gen.exe native/terrain_gen.cpp
          dir native\terrain_gen.exe

      - name: Nuitka 打包 Windows
        shell: pwsh
        run: >
          python -m nuitka
          --standalone
          --onefile
          --assume-yes-for-downloads
          --mingw64
          --output-dir=dist
          --include-data-dir=native=native
          --windows-console-mode=force
          --output-filename=PyMC-windows.exe
          main.py

      - name: 验证 Windows 产物
        shell: pwsh
        run: |
          dir dist\PyMC-windows.exe

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pymc-windows
          path: dist/PyMC-windows.exe

  build-linux:
    name: 构建 Linux 版本
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ patchelf upx-ucl

      - name: 安装 Nuitka
        run: pip install nuitka ordered-set zstandard

      - name: 编译 terrain_gen
        run: |
          g++ -O3 -std=c++17 -static -o native/terrain_gen native/terrain_gen.cpp
          ls -l native/terrain_gen

      - name: Nuitka 打包 Linux
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --include-data-dir=native=native \
            --output-filename=PyMC-linux \
            main.py

      - name: 验证 Linux 产物
        run: |
          ls -l dist/PyMC-linux
          chmod +x dist/PyMC-linux

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pymc-linux
          path: dist/PyMC-linux

  release:
    name: 发布 Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: pymc-windows
          path: release_files

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v4
        with:
          name: pymc-linux
          path: release_files

      - name: 生成版本号
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PyMC ${{ steps.version.outputs.tag }}
          body: |
            ## PyMC ${{ steps.version.outputs.tag }}

            Minecraft Java Edition 1.21.1 (协议版本 767) 纯 Python 服务端。

            ### 包含文件
            - `PyMC-windows.exe`：Windows 版本
            - `PyMC-linux`：Linux 版本

            ### 使用方法

            #### Windows
            1. 下载 `PyMC-windows.exe`
            2. 双击运行
            3. Minecraft 客户端连接 `localhost:25565`

            #### Linux
            1. 下载 `PyMC-linux`
            2. 执行 `chmod +x PyMC-linux`
            3. 运行 `./PyMC-linux`
            4. Minecraft 客户端连接 `localhost:25565`

            ### 包含
            - Python 服务端（Nuitka 编译）
            - C++ 原生地形生成器（已内置）
          files: |
            release_files/PyMC-windows.exe
            release_files/PyMC-linux
          draft: false
          prerelease: true
          generate_release_notes: true      # --- 安装 Nuitka 及依赖 ---
      - name: 安装 Nuitka
        run: pip install nuitka ordered-set zstandard

      # --- 安装 MinGW (用于 C++ 编译和 Nuitka 后端) ---
      - name: 安装 MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: 13.2.0

      # --- 编译 C++ 原生地形生成器 ---
      - name: 编译 terrain_gen.exe
        run: |
          g++ -O3 -std=c++17 -static -o native/terrain_gen.exe native/terrain_gen.cpp
          echo "terrain_gen.exe 编译完成"
          dir native\terrain_gen.exe

      # --- Nuitka 打包 ---
      - name: Nuitka 打包
        run: >
          python -m nuitka
          --standalone
          --onefile
          --assume-yes-for-downloads
          --mingw64
          --output-dir=dist
          --include-data-dir=native=native
          --windows-console-mode=force
          --output-filename=PyMC.exe
          main.py

      # --- 验证产物 ---
      - name: 验证构建产物
        run: |
          dir dist\PyMC.exe
          echo "构建成功"

      - name: 生成版本号
        id: release_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: PyMC ${{ steps.release_version.outputs.tag }}
