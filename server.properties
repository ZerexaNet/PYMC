# ============================================================
# PyMC 服务器配置文件
# Minecraft 1.21.1 服务端
# ============================================================

server-ip=0.0.0.0
server-port=25565
motd=PyMC - Python Minecraft 1.21.1 服务器
max-players=20
online-mode=false
view-distance=4
network-compression-threshold=256
gamemode=survival
difficulty=normal
level-name=world
level-type=default
level-seed=12345
level-spawn-x=0
level-spawn-y=100
level-spawn-z=0
spawn-protection=0
enable-command-block=true
web-admin-enabled=true
web-admin-host=127.0.0.1
web-admin-port=25568
web-admin-allow-remote=false
permissions-file=permissions.json
chunk-generation-multithreading=false
chunk-generation-workers=0
join-immediate-radius=2
# Multi-version protocol support
support-protocol-versions=all
min-protocol-version=47
max-protocol-version=770

# Watchdog dual-process mutual protection
watchdog-enabled=false
watchdog-health-port=25569
watchdog-partner-pid=0
watchdog-max-missed-heartbeats=5

# Network optimization
network-packet-batching=true
network-movement-rate-hz=20

# Vanilla terrain generation
vanilla-terrain=true

# Redstone
redstone-enabled=true

# Fluids
fluid-flow-enabled=true

# PYMC native Python mod and plugin directories
mods-directory=mods
plugins-directory=plugins
